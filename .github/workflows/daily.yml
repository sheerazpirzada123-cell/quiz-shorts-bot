name: Daily Parable Short

on:
  schedule:
    # Har 2 din mein ek baar (day-of-month */2). Ghanta/minute random hoga script ke andar.
    - cron: "0 0 */2 * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "YouTube par upload karna hai? Band karo to sirf test hoga (video artifact mein milegi)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:                 # do runs ek saath na chalein (history.json push conflict se bachne ke liye)
  group: shorts-bot
  cancel-in-progress: false

env:
  # Pehle 240 min tak sleep hota tha = har run ke runner minutes zaya (private repo par 2000 free min/month hi hote hain).
  # GitHub cron khud bhi kuch minute late hota hai, isliye 15 min ka jitter kaafi hai.
  MAX_DELAY_MIN: "15"
  DO_UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload == false) && 'false' || 'true' }}

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Random wait (sirf scheduled run par)
        if: github.event_name == 'schedule'
        run: |
          # Random hour (0-23), random minute (0-59), random second (0-59) — poora din random
          RAND_H=$((RANDOM % 24))
          RAND_M=$((RANDOM % 60))
          RAND_S=$((RANDOM % 60))
          NOW_H=$(date +%H)
          NOW_M=$(date +%M)
          NOW_S=$(date +%S)

          # Aaj ke random target time tak ke seconds nikalo (agar beet gaya to agle din ka)
          TARGET_SEC=$(( RAND_H*3600 + RAND_M*60 + RAND_S ))
          NOW_SEC=$(( 10#$NOW_H*3600 + 10#$NOW_M*60 + 10#$NOW_S ))
          DELAY=$(( TARGET_SEC - NOW_SEC ))
          if [ "$DELAY" -le 0 ]; then
            DELAY=$(( DELAY + 86400 ))
          fi

          # Safety cap: runner minutes bachane ke liye max 6 ghante se zyada sleep mat karo
          MAX_SLEEP=$(( 6*3600 ))
          if [ "$DELAY" -gt "$MAX_SLEEP" ]; then
            DELAY=$(( MAX_SLEEP ))
          fi

          echo "Random target: ${RAND_H}:${RAND_M}:${RAND_S} UTC | abhi: ${NOW_H}:${NOW_M}:${NOW_S} UTC"
          echo "Sleeping $((DELAY / 3600))h $(( (DELAY % 3600) / 60 ))m $((DELAY % 60))s"
          sleep "$DELAY"

      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          [ -n "$GEMINI_API_KEY" ] || { echo "::error::GEMINI_API_KEY secret missing"; exit 1; }
          if [ "$DO_UPLOAD" = "true" ]; then
            [ -n "$YT_ID" ] && [ -n "$YT_SECRET" ] && [ -n "$YT_REFRESH" ] || { echo "::error::YouTube secret(s) missing"; exit 1; }
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core   # caption font repo ke fonts/ folder mein hai

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache Kokoro voice + Depth Anything V2 Small model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-82m-depthanything-v2-small-v1

      - name: Generate parable story script (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python story_gen.py

      - name: Render video (45 min se kam)
        timeout-minutes: 45
        env:
          MUSIC_MODE: synth
          KOKORO_VOICE: am_michael       # gehri calm narrator awaaz (am_adam / bm_george bhi chal jaati hain)
          EDGE_VOICE: en-US-GuyNeural    # Kokoro fail ho to backup awaaz
          VOICE_SPEED: "1.0"             # video 60-80s ki banti hai; bahar jaye to 0.95-1.1 try karo
          IMG_BUDGET_SEC: "600"          # images ke liye max 10 min, baaki scenes fallback se
          DEPTH_MODEL: depth-anything/Depth-Anything-V2-Small-hf   # CPU par ~1-3 s/image, har location par sirf ek baar; fail ho to synthetic depth
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          fc-cache -f
          python render_story.py

      - name: Upload to YouTube
        if: env.DO_UPLOAD == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python main.py

      - name: Keep video as artifact (manual runs only)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            output.mp4
            script.json
            story_plan.md
          retention-days: 2
          if-no-files-found: ignore

      - name: Save topic history
        if: env.DO_UPLOAD == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "update topic history" && git pull --rebase && git push)
