name: Daily Explainer Short

on:
  schedule:
    # Din mein 2 baar start hota hai; asal posting time neeche random delay se random hota hai.
    - cron: "0 4 * * *"   # window 1: 09:00 PKT se shuru
    - cron: "0 13 * * *"  # window 2: 18:00 PKT se shuru
  workflow_dispatch:       # manual run: delay nahi hota, foran chalta hai
    inputs:
      mode:
        description: "Kya banana hai? short = sirf ek Short (sabse tez) | long = sirf long video | both = long video + usko promote karne wala Short (cron yehi karta hai)"
        type: choice
        default: short
        options:
          - short
          - long
          - both
      upload:
        description: "YouTube par upload karna hai? Band karo to sirf test hoga (video Artifacts mein milegi, topic history save nahi hogi)"
        type: boolean
        default: true

permissions:
  contents: write          # history.json (purane topics) wapas commit karne ke liye

env:
  # Har run is se zyada se zyada itne minute baad post karega (random minutes + seconds).
  # Private repo ho to free minutes bachane ke liye ise kam kar dein (e.g. 90).
  MAX_DELAY_MIN: "240"
  # Long video ki script lambai (words): 1500 = ~9 min, 1700 = ~10 min.
  LONG_TARGET_WORDS: "1500"
  # cron par hamesha both; manual run par jo option chuna wo.
  MODE: ${{ inputs.mode || 'both' }}
  DO_UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload == false) && 'false' || 'true' }}

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Random wait (sirf scheduled run par)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$(shuf -i 0-$((MAX_DELAY_MIN * 60)) -n 1)
          echo "Sleeping $((DELAY / 60)) min $((DELAY % 60)) sec before generating and posting"
          sleep "$DELAY"

      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache Kokoro voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Generate script (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python script_gen.py

      - name: Render video (code-drawn stick-man animation + Kokoro voice + music)
        timeout-minutes: 12
        env:
          # Koi image API nahi. Music code se banta hai (MUSIC_MODE=download karne par Kevin MacLeod CC-BY track utarta hai)
          MUSIC_MODE: synth
        run: |
          fc-cache -f
          python render.py

      - name: Upload to YouTube
        if: env.DO_UPLOAD == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python main.py

      - name: Keep videos as artifact (manual runs only)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: |
            output_*.mp4
            thumbnail.jpg
            script_*.json
          retention-days: 2
          if-no-files-found: ignore

      - name: Save topic history
        if: env.DO_UPLOAD == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "update topic history" && git pull --rebase && git push)
