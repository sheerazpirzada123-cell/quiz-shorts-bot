name: Daily Quiz Short

on:
  schedule:
    - cron: "0 8 * * *"  # UTC 8:00, Pakistan time 13:00
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python render.py

      - name: Upload to YouTube
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          echo "$YOUTUBE_CLIENT_SECRET" > client_secret.json
          echo "$YOUTUBE_TOKEN" | base64 -d > token.pickle
          python -c "
          from main import upload_short
          upload_short('output.mp4', 'Guess the Answer! #Shorts', 'Daily quiz short. #Shorts', ['quiz', 'trivia'])
          "
