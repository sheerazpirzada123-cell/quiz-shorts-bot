name: Daily Dark Story Short

on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "YouTube par upload karna hai? Band karo to sirf test hoga (video artifact mein milegi)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:                 # do runs ek saath na chalein (history.json push conflict se bachne ke liye)
  group: shorts-bot
  cancel-in-progress: false

env:
  # Pehle 240 min tak sleep hota tha = har run ke runner minutes zaya (private repo par 2000 free min/month hi hote hain).
  # GitHub cron khud bhi kuch minute late hota hai, isliye 15 min ka jitter kaafi hai.
  MAX_DELAY_MIN: "15"
  DO_UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload == false) && 'false' || 'true' }}

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Random wait (sirf scheduled run par)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$(shuf -i 0-$((MAX_DELAY_MIN * 60)) -n 1)
          echo "Sleeping $((DELAY / 60)) min $((DELAY % 60)) sec before generating and posting"
          sleep "$DELAY"

      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          [ -n "$GEMINI_API_KEY" ] || { echo "::error::GEMINI_API_KEY secret missing"; exit 1; }
          if [ "$DO_UPLOAD" = "true" ]; then
            [ -n "$YT_ID" ] && [ -n "$YT_SECRET" ] && [ -n "$YT_REFRESH" ] || { echo "::error::YouTube secret(s) missing"; exit 1; }
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache Kokoro voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Generate dark story script (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python story_gen.py

      - name: Render video
        timeout-minutes: 45
        env:
          MUSIC_MODE: synth
          KOKORO_VOICE: bm_george        # gehri dramatic awaaz (am_adam / am_michael bhi chal jaati hain)
          EDGE_VOICE: en-GB-RyanNeural   # Kokoro fail ho to backup awaaz
          VOICE_SPEED: "0.98"            # thodi dheemi = mysterious; video 45-60s se bahar jaye to 1.0-1.08 try karo
          IMG_BUDGET_SEC: "600"          # images ke liye max 10 min, baaki scenes fallback se
        run: |
          fc-cache -f
          python render_story.py

      - name: Upload to YouTube
        if: env.DO_UPLOAD == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python main.py

      - name: Keep video as artifact (manual runs only)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            output.mp4
            script.json
            story_plan.md
          retention-days: 2
          if-no-files-found: ignore

      - name: Save topic history
        if: env.DO_UPLOAD == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "update topic history" && git pull --rebase && git push)
